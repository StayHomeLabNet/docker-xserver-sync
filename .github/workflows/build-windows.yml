name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Test and build Windows app
        shell: pwsh
        run: ./scripts/build-app.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: docker-xserver-sync-windows-x64
          path: dist/Docker XServer Sync-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
