name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Test and build Windows app and installer
        shell: pwsh
        run: ./scripts/build-app.ps1 -BuildInstaller

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: docker-xserver-sync-windows-v0.3.0
          path: |
            dist/Docker XServer Sync-Windows-x64.zip
            dist/Docker-XServer-Sync-Setup-v0.3.0.exe
          if-no-files-found: error
          retention-days: 14
