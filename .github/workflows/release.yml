name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for manual dispatch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            patchelf

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Test and build Linux app
        run: bash scripts/build-app-linux.sh

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/Docker XServer Sync-Linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read project version
        id: meta
        shell: pwsh
        run: |
          $ver = python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Test and build Windows app and installer
        shell: pwsh
        run: ./scripts/build-app.ps1 -BuildInstaller

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/Docker XServer Sync-Windows-x64.zip
            dist/Docker-XServer-Sync-Setup-v${{ steps.meta.outputs.version }}.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Test and build macOS app
        env:
          QT_QPA_PLATFORM: offscreen
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: zsh scripts/build-app.sh

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/Docker XServer Sync-macOS-arm64.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES_FILE="docs/release-notes-${TAG_NAME}.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
            fi
          fi
