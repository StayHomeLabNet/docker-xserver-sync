name: Build Linux app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            patchelf

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Test and build Linux app
        run: bash scripts/build-app-linux.sh

      - name: Upload Linux release file
        uses: actions/upload-artifact@v7
        with:
          name: docker-xserver-sync-linux-v0.1.7
          path: dist/Docker XServer Sync-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
