name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install project and test dependencies
        run: uv sync --python 3.12 --extra dev --extra gui --extra ssh

      - name: Run linter
        run: uv run ruff check src tests

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && '' || 'offscreen' }}
        run: uv run pytest -v
